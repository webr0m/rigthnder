name: Test optimized Android and FCM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:android
        env:
          VITE_API_URL: https://onlyfachos.webrom.cc
          VITE_ADMOB_TEST_MODE: 'true'
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile optimized startup app and separate FCM instrumentation
        run: chmod +x android/gradlew && cd android && ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon -PonlyfachosTestSigning=true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.rigthnder.app/.MainActivity
            sleep 5
            adb shell pidof com.rigthnder.app
            adb shell am force-stop com.rigthnder.app
            cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon -PonlyfachosTestSigning=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OnlyFachos-Android-smoke-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 7
