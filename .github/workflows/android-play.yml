name: Build Android for Google Play
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - run: pnpm mobile:android
        env:
          VITE_API_URL: https://onlyfachos.webrom.cc
          VITE_ADMOB_ENABLED: 'false'
      - run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease --no-daemon
      - name: Verify beta has no advertising SDK or advertising ID permission
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/bundle/release/app-release.aab') as bundle:
              for name in bundle.namelist():
                  if name.endswith('.dex') or name.endswith('AndroidManifest.xml'):
                      data = bundle.read(name)
                      for marker in (b'Lcom/google/android/gms/ads/', b'Lcom/getcapacitor/community/admob/', b'com.google.android.gms.permission.AD_ID'):
                          assert marker not in data, f'Unexpected advertising component in {name}'
          print('Verified: beta bundle excludes AdMob and AD_ID')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: OnlyFachos-Play-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
