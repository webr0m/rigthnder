name: Build Android for Google Play
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - run: pnpm mobile:android
        env:
          VITE_API_URL: https://onlyfachos.webrom.cc
          VITE_ADMOB_ENABLED: 'true'
          VITE_ADMOB_TEST_MODE: 'true'
      - run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease --no-daemon
      - name: Verify AdMob and FCM are packaged with test advertising configuration
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/bundle/release/app-release.aab') as bundle:
              dex = b''.join(bundle.read(name) for name in bundle.namelist() if name.endswith('.dex'))
              manifest = bundle.read('base/manifest/AndroidManifest.xml')
              for marker in (b'Lcom/google/android/gms/ads/', b'Lcom/getcapacitor/community/admob/', b'Lcom/google/firebase/messaging/FirebaseMessaging;'):
                  assert marker in dex, f'Missing native component: {marker}'
              assert b'com.google.android.gms.permission.AD_ID' in manifest
              resources = bundle.read('base/resources.pb')
              assert b'ca-app-pub-3940256099942544~3347511713' in resources
          print('Verified: AdMob test app and FCM included; update Play advertising disclosures before upload')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: OnlyFachos-Play-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
