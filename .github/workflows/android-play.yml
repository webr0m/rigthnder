name: Build Android for Google Play
on:
  workflow_dispatch:
    inputs:
      advertising:
        description: Advertising configuration (production does not publish to Play)
        required: true
        default: test
        type: choice
        options:
          - test
          - production
      version_code:
        description: Android version code; use a new number before uploading to Play
        required: true
        default: '10011'
        type: string
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - name: Validate version code
        env:
          ONLYFACHOS_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          node -e "const n=process.env.ONLYFACHOS_VERSION_CODE; if(!/^[1-9][0-9]{0,9}$/.test(n)||Number(n)>2100000000) throw Error('Invalid Android version code')"
      - run: pnpm mobile:android
        env:
          VITE_API_URL: https://onlyfachos.webrom.cc
          VITE_ADMOB_ENABLED: 'true'
          VITE_ADMOB_TEST_MODE: ${{ inputs.advertising == 'production' && 'false' || 'true' }}
      - name: Build Android App Bundle
        env:
          ONLYFACHOS_VERSION_CODE: ${{ inputs.version_code }}
        run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease --no-daemon -PonlyfachosVersionCode="$ONLYFACHOS_VERSION_CODE"
      - name: Verify packaged AdMob configuration and FCM
        env:
          ADVERTISING_MODE: ${{ inputs.advertising }}
        run: |
          python3 - <<'PY'
          import json, os, zipfile, re
          mapping = open('android/app/build/outputs/mapping/release/mapping.txt').read()
          with zipfile.ZipFile('android/app/build/outputs/bundle/release/app-release.aab') as bundle:
              dex = b''.join(bundle.read(name) for name in bundle.namelist() if name.endswith('.dex'))
              manifest = bundle.read('base/manifest/AndroidManifest.xml')
              for original in ('com.getcapacitor.community.admob.AdMob', 'com.google.firebase.messaging.FirebaseMessaging', 'com.capacitorjs.plugins.pushnotifications.PushNotificationsPlugin', 'com.rigthnder.app.OnlyFachosDevicePlugin'):
                  match = re.search(r'^' + re.escape(original) + r' -> ([^:]+):$', mapping, re.M)
                  assert match, f'Missing R8 component: {original}'
                  descriptor = ('L' + match.group(1).replace('.', '/') + ';').encode()
                  assert descriptor in dex, f'Missing optimized native component: {original}'
              assert b'com.google.android.gms.permission.AD_ID' in manifest
              assert b'android.permission.POST_NOTIFICATIONS' in manifest
              assert 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map' in bundle.namelist(), 'Missing embedded R8 mapping'
              resources = bundle.read('base/resources.pb')
              app_id = (json.load(open('mobile-ads.json'))['android']['appId']
                        if os.environ['ADVERTISING_MODE'] == 'production'
                        else 'ca-app-pub-3940256099942544~3347511713')
              assert app_id.encode() in resources, 'Packaged AdMob App ID does not match selected mode'
          print('Verified: AdMob mode=' + os.environ['ADVERTISING_MODE'] + ', AD_ID and FCM included. Artifact only; no Play publication.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: OnlyFachos-Play-unsigned-${{ inputs.advertising }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 14
